<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Authentication - Automind Dynamics</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/Assets/Images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Assets/Images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Assets/Images/apple-touch-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-base: #06070a;
            --bg-surface: #0e1017;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --font-main: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', 'Chakra Petch', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.4rem;
            color: #ffffff;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 0.45rem;
        }

        .input-field {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(20, 23, 34, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #ffffff;
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
            background: rgba(25, 29, 44, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }

        .btn-submit:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .login-footer {
            margin-top: 1.75rem;
            text-align: center;
        }

        .login-footer a {
            font-size: 0.82rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .login-footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
            </div>
            <h1>Tech Console</h1>
            <p>Enter security passcode to manage systems & documentation</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label for="password">System Passcode</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required autofocus>
            </div>

            <button type="submit" class="btn-submit">Authenticate</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('home') }}">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Return to Main Website
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
